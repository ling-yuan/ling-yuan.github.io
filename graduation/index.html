    <script>
        // 获取所有行
        const lines = document.querySelectorAll('.line');
        // 获取所有jpg图片路径
        const imgCount = 43; // 7x7
        const imgList = [];
        for (let i = 1; i <= imgCount; i++) {
            imgList.push(`dealimg/img${i}.jpg`);
        }
        // 给每个item分配图片
        let imgIdx = 0;
        lines.forEach((line) => {
            const items = line.querySelectorAll('.item');
            items.forEach((item) => {
                imgIdx = imgIdx % imgList.length; // 循环使用图片
                if (imgIdx < imgList.length) {
                    item.src = imgList[imgIdx];
                    item.alt = `Image ${imgIdx + 1}`;
                    // 不改变图片长宽比
                    // item.style.objectFit = 'cover';
                    // 设置图片加载完成后的样式
                    item.addEventListener('error', () => {
                        console.error(`Image ${imgList[imgIdx]} failed to load.`);
                    });
                    imgIdx++;
                }
            });
        });
        // 交互效果
        lines.forEach((line, rowIdx) => {
            const items = line.querySelectorAll('.item');
            items.forEach((item, colIdx) => {
                item.addEventListener('mouseenter', () => {
                    document.querySelectorAll('.item').forEach(i => {
                        i.classList.remove('active', 'shrink');
                    });
                    item.classList.add('active');
                    const neighborPos = [
                        [rowIdx, colIdx - 1], [rowIdx, colIdx + 1],
                        [rowIdx - 1, colIdx], [rowIdx + 1, colIdx],
                    ];
                    if (rowIdx % 2 === 0) {
                        neighborPos.push([rowIdx - 1, colIdx + 1], [rowIdx + 1, colIdx + 1]);
                    } else {
                        neighborPos.push([rowIdx - 1, colIdx - 1], [rowIdx + 1, colIdx - 1]);
                    }
                    neighborPos.forEach(([r, c]) => {
                        if (lines[r] && lines[r].children[c]) {
                            lines[r].children[c].classList.add('shrink');
                        }
                    });
                });
                item.addEventListener('mouseleave', () => {
                    document.querySelectorAll('.item').forEach(i => {
                        i.classList.remove('active', 'shrink');
                    });
                });
            });
        });
    </script>
